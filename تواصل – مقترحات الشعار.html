<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تواصل – مقترحات الشعار</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&family=Tajawal:wght@800&display=swap">
<style>
:root{--bg:#1b0a21;--ink:#fbf3ff;--muted:#bda8c9;--line:rgba(255,255,255,.14);--panel:rgba(255,255,255,.05);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4ecdc;--ink:#2b1234;--muted:#6c5778;--line:rgba(43,18,52,.15);--panel:rgba(255,255,255,.6);color-scheme:light}}
:root[data-theme="dark"]{--bg:#1b0a21;--ink:#fbf3ff;--muted:#bda8c9;--line:rgba(255,255,255,.14);--panel:rgba(255,255,255,.05);color-scheme:dark}
:root[data-theme="light"]{--bg:#f4ecdc;--ink:#2b1234;--muted:#6c5778;--line:rgba(43,18,52,.15);--panel:rgba(255,255,255,.6);color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;padding:2rem clamp(1rem,4vw,3rem);overflow-x:hidden}
header{max-width:1100px;margin:0 auto 2rem;display:flex;justify-content:space-between;align-items:end;gap:1rem;flex-wrap:wrap}
h1{margin:0;font-size:1.7rem}header p{margin:.3rem 0 0;color:var(--muted)}
.tb{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:.5rem 1rem;font:inherit;cursor:pointer}.tb:focus-visible{outline:2px solid #b8f24b;outline-offset:2px}
.grid{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:1.25rem}
.c{border:1px solid var(--line);border-radius:24px;background:var(--panel);padding:1rem;display:grid;gap:.9rem}
.c h2{margin:.2rem .4rem 0;font-size:1.05rem}.c h2 small{color:var(--muted);font-weight:400;margin-inline-start:.5rem}
.s{border-radius:16px;padding:1.4rem;display:grid;place-items:center;--a:#b8f24b;--b:#ff6f61;--t:#fbf3ff;background:#1b0a21;color:var(--t)}
.s.l{--a:#8fc41f;--b:#f0584a;--t:#2b1234;background:#faf5ea}
.lock{display:flex;align-items:center;gap:.8rem}
.lock svg{width:64px;height:64px;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}.c:hover .lock svg{transform:rotate(-8deg) scale(1.08)}
.w{font-family:Tajawal,sans-serif;font-weight:800;font-size:2rem;line-height:1}
.w small{display:block;font:600 .62rem "IBM Plex Sans Arabic",sans-serif;letter-spacing:.38em;margin-top:.4rem;direction:ltr;opacity:.7}
.row{display:flex;align-items:center;justify-content:center;gap:1rem;flex-wrap:wrap}
.ic{width:64px;height:64px;border-radius:16px;background:#1b0a21;display:grid;place-items:center;--a:#b8f24b;--b:#ff6f61;box-shadow:0 8px 24px -10px #000}.ic svg{width:42px;height:42px}
.ic.g{background:#b8f24b;--a:#1b0a21;--b:#ff6f61}
.ic.r{border-radius:50%}
.sm{display:flex;gap:.8rem;align-items:center;color:var(--a);--a:#b8f24b;--b:#ff6f61}
footer{max-width:1100px;margin:2rem auto 0;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.9rem}
footer i{width:28px;height:28px;border-radius:50%;display:inline-block;border:1px solid var(--line)}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="A" viewBox="0 0 64 64" fill="none"><path d="M32 6A24 24 0 1 1 20.5 51L9 56L13.5 44.8A24 24 0 0 1 32 6Z" stroke="var(--a)" stroke-width="3.5" stroke-linejoin="round"/><path d="M23 27L41 33" stroke="var(--a)" stroke-width="2" stroke-linecap="round" opacity=".6"/><circle cx="23" cy="27" r="5.5" fill="var(--a)"/><circle cx="41" cy="33" r="5.5" fill="var(--b)"/></symbol>
<symbol id="B" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="22" stroke="var(--a)" stroke-width="3.5"/><path d="M32 32L47.6 16.4" stroke="var(--a)" stroke-width="2" stroke-linecap="round" opacity=".6"/><circle cx="32" cy="32" r="6" fill="var(--a)"/><circle cx="47.6" cy="16.4" r="6.5" fill="var(--b)"/></symbol>
<symbol id="C" viewBox="0 0 64 64" fill="none"><clipPath id="cc"><circle cx="25" cy="32" r="18"/></clipPath><circle cx="39" cy="32" r="18" fill="var(--a)" clip-path="url(#cc)"/><circle cx="25" cy="32" r="18" stroke="var(--a)" stroke-width="3.5"/><circle cx="39" cy="32" r="18" stroke="var(--b)" stroke-width="3.5"/></symbol>
</defs></svg>
<header><div><h1>مقترحات شعار تواصل</h1><p>ثلاث أفكار بنفس الهوية. اختاري حرفاً وأكمل عليه.</p></div><button class="tb" id="t" type="button">تبديل الخلفية</button></header>
<main class="grid" id="g"></main>
<footer>الألوان: <i style="background:#1b0a21"></i> برقوقي <i style="background:#b8f24b"></i> لايم <i style="background:#ff6f61"></i> كورال <i style="background:#faf5ea"></i> عاجي · الخط: Tajawal</footer>
<script>
var items=[["A","فقاعة الحوار","شخصان داخل محادثة. الأوضح للمراسلة."],["B","المدار","نقطة مركزية وقمر متصل. هادئ وعصري."],["C","التقاء الدائرتين","دائرتان تتقاطعان. الأبسط والأقوى بالحجم الصغير."]];
document.getElementById("g").innerHTML=items.map(function(x){var u='<svg><use href="#'+x[0]+'"/></svg>';
var w='<div class="w">تواصل<small>TAWASOL</small></div>';
return '<article class="c"><h2>'+x[0]+' · '+x[1]+'<small>'+x[2]+'</small></h2>'+
'<div class="s"><div class="lock">'+u+w+'</div></div>'+
'<div class="s l"><div class="lock">'+u+w+'</div></div>'+
'<div class="row"><div class="ic">'+u+'</div><div class="ic g">'+u+'</div><div class="ic r">'+u+'</div>'+
'<div class="sm"><svg width="32" height="32"><use href="#'+x[0]+'"/></svg><svg width="20" height="20"><use href="#'+x[0]+'"/></svg><svg width="14" height="14"><use href="#'+x[0]+'"/></svg></div></div></article>'}).join("");
document.getElementById("t").onclick=function(){var r=document.documentElement,c=r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");r.setAttribute("data-theme",c==="light"?"dark":"light")};
</script></body></html>
