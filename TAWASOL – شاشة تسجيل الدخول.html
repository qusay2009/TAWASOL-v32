<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تواصل – تسجيل الدخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@800&display=swap">
<style>
:root{--bg:#1b0a21;--bg2:#2d1337;--ink:#fbf3ff;--muted:#bda8c9;--lime:#b8f24b;--limeInk:#1d2b03;--coral:#ff6f61;--err:#ff8f84;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--field:rgba(12,4,16,.5);--glow:rgba(184,242,75,.32);--card:rgba(40,18,50,.55);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#faf5ea;--bg2:#efe4cf;--ink:#2b1234;--muted:#6c5778;--lime:#a5df32;--limeInk:#1d2b03;--coral:#f0584a;--err:#c23a2d;--glass:rgba(255,255,255,.6);--line:rgba(43,18,52,.15);--field:rgba(255,255,255,.92);--glow:rgba(120,170,20,.3);--card:rgba(255,252,245,.72);color-scheme:light}}
:root[data-theme="dark"]{--bg:#1b0a21;--bg2:#2d1337;--ink:#fbf3ff;--muted:#bda8c9;--lime:#b8f24b;--limeInk:#1d2b03;--coral:#ff6f61;--err:#ff8f84;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--field:rgba(12,4,16,.5);--glow:rgba(184,242,75,.32);--card:rgba(40,18,50,.55);color-scheme:dark}
:root[data-theme="light"]{--bg:#faf5ea;--bg2:#efe4cf;--ink:#2b1234;--muted:#6c5778;--lime:#a5df32;--limeInk:#1d2b03;--coral:#f0584a;--err:#c23a2d;--glass:rgba(255,255,255,.6);--line:rgba(43,18,52,.15);--field:rgba(255,255,255,.92);--glow:rgba(120,170,20,.3);--card:rgba(255,252,245,.72);color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;min-height:100dvh;font-family:"IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden;transition:background .5s,color .5s}
body{--mx:0;--my:0;--lx:70%;--ly:40%}
.stage{position:relative;min-height:100dvh;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:2rem;padding:2rem clamp(1.25rem,5vw,5rem);overflow:hidden;isolation:isolate}
.bg{position:absolute;inset:0;z-index:-2;background:radial-gradient(900px 600px at var(--lx) var(--ly),var(--glow),transparent 60%),radial-gradient(1200px 800px at 15% 110%,var(--bg2),transparent 65%),var(--bg)}
/* scene */
.scene{position:relative;display:grid;place-items:center;min-height:min(78vh,720px)}
.layer{position:absolute;inset:0;transform:translate3d(calc(var(--mx)*var(--d,10)*1px),calc(var(--my)*var(--d,10)*1px),0);transition:transform .25s ease-out;pointer-events:none}
.orbits{width:min(100%,640px);margin:auto;aspect-ratio:1;position:absolute;inset:0;height:100%}
.orb{transform-origin:50% 50%;transform-box:view-box;animation:spin var(--t,50s) linear infinite}
.orb.r{animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.ring{fill:none;stroke:var(--line);stroke-width:1}
.dash{fill:none;stroke:var(--lime);stroke-width:1.2;opacity:.55;stroke-dasharray:4 10;animation:flow 6s linear infinite}
.dash.c{stroke:var(--coral)}
@keyframes flow{to{stroke-dashoffset:-140}}
.nd{fill:var(--lime);filter:drop-shadow(0 0 8px var(--lime))}.nd.c{fill:var(--coral);filter:drop-shadow(0 0 8px var(--coral))}
.core{fill:var(--lime);transform-origin:50% 50%;transform-box:view-box;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.25);opacity:.7}}
.chat{position:absolute;display:flex;align-items:center;gap:.6rem;padding:.65rem .8rem;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:float var(--f,7s) ease-in-out infinite;animation-delay:var(--fd,0s)}
@keyframes float{50%{transform:translateY(-14px)}}
.chat i{width:28px;height:28px;border-radius:50%;background:var(--lime);flex:none}.chat.c i{background:var(--coral)}
.chat b{display:block;height:6px;border-radius:3px;background:var(--line);margin:4px 0;width:var(--w,70px)}
.chat .dots{display:flex;gap:4px}.chat .dots s{width:6px;height:6px;border-radius:50%;background:var(--ink);opacity:.5;animation:blink 1.2s infinite}.chat .dots s:nth-child(2){animation-delay:.2s}.chat .dots s:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:1;transform:translateY(-3px)}}
/* brand */
.brand{position:absolute;inset-block-start:0;inset-inline-start:0;display:flex;align-items:center;gap:.75rem;z-index:5;margin:0}
.brand-wrap{position:absolute;inset-block-start:1.75rem;inset-inline-start:clamp(1.25rem,5vw,5rem);z-index:20}
.logo{display:flex;align-items:center;gap:.7rem;will-change:transform}
.logo svg{width:46px;height:46px;filter:drop-shadow(0 0 14px var(--glow))}
.logo span{display:block;font-family:Tajawal,"IBM Plex Sans Arabic",sans-serif;font-weight:800;font-size:1.5rem;line-height:1}
.logo small{display:block;font-size:.68rem;letter-spacing:.32em;color:var(--muted);margin-top:.3rem;direction:ltr;text-align:start}
.tag{position:absolute;inset-inline-start:0;inset-block-end:2rem;max-width:22rem;margin:0;color:var(--muted);font-size:1.05rem;line-height:1.8}
/* card */
.cardwrap{display:grid;place-items:center;perspective:1200px}
.card{width:min(100%,430px);padding:2rem;border-radius:28px;background:var(--card);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);border:1px solid transparent;background-clip:padding-box;position:relative;box-shadow:0 30px 80px -30px rgba(0,0,0,.55),0 0 60px -20px var(--glow);transform:rotateY(calc(var(--mx)*-3deg)) rotateX(calc(var(--my)*3deg));transition:transform .3s ease-out,opacity .5s,filter .5s}
.card::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:linear-gradient(140deg,var(--lime),transparent 35%,transparent 65%,var(--coral));opacity:.6;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.card.leave{animation:leave .7s cubic-bezier(.6,0,.8,.3) forwards}
@keyframes leave{to{opacity:0;transform:translateY(-40px) scale(.92);filter:blur(8px)}}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;background:var(--field);border:1px solid var(--line);margin-bottom:1.5rem}
.seg button{position:relative;z-index:1;border:0;background:none;color:var(--muted);font:600 .95rem inherit;font-family:inherit;padding:.65rem;cursor:pointer;border-radius:10px;transition:color .3s}
.seg button[aria-selected=true]{color:var(--limeInk)}
.seg .pill{position:absolute;inset:4px;width:calc(50% - 4px);border-radius:10px;background:var(--lime);box-shadow:0 6px 20px -6px var(--lime);transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
.seg[data-mode=signup] .pill{transform:translateX(-100%)}
h1{margin:0 0 .35rem;font-size:1.6rem;font-weight:700}
.sub{margin:0 0 1.4rem;color:var(--muted);font-size:.95rem;min-height:1.5em}
.sw{transition:opacity .25s,transform .25s}.sw.out{opacity:0;transform:translateY(6px)}
.fold{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s ease,opacity .35s;opacity:0}
.fold>div{overflow:hidden;min-height:0}
[data-mode=signup] .fold,.card[data-mode=signup] .fold{grid-template-rows:1fr;opacity:1}
.field{margin-bottom:1rem}
.field label{display:block;font-size:.88rem;font-weight:500;margin-bottom:.4rem}
.box{position:relative;display:flex;align-items:center;border-radius:14px;background:var(--field);border:1.5px solid var(--line);transition:border-color .25s,box-shadow .25s}
.box:focus-within{border-color:var(--lime);box-shadow:0 0 0 4px var(--glow)}
.box.bad{border-color:var(--coral);box-shadow:0 0 0 3px rgba(255,111,97,.22)}
.box svg.ic{width:20px;height:20px;margin-inline-start:.9rem;color:var(--muted);flex:none}
.box input{flex:1;min-width:0;border:0;background:none;outline:0;color:var(--ink);font:inherit;font-size:1rem;padding:.85rem .75rem;text-align:start}
.box input[type=email]{direction:ltr;text-align:right}
.box input::placeholder{color:var(--muted);opacity:.6}
.eye{border:0;background:none;color:var(--muted);cursor:pointer;padding:.5rem;margin-inline-end:.4rem;border-radius:10px;display:grid;place-items:center}
.eye:hover{color:var(--ink)}.eye:focus-visible,.seg button:focus-visible,.theme:focus-visible,.skip:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.eye svg{width:20px;height:20px}
.msg{display:none;align-items:center;gap:.4rem;margin:.4rem 0 0;color:var(--err);font-size:.85rem}
.msg.show{display:flex;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(-4px)}}
.alert{padding:.75rem .9rem;border-radius:12px;background:rgba(255,111,97,.14);border:1px solid rgba(255,111,97,.45);color:var(--err);font-size:.9rem;margin-bottom:1rem;display:none}
.alert.show{display:block;animation:in .3s}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.go{width:100%;display:flex;align-items:center;justify-content:center;gap:.6rem;border:0;border-radius:14px;padding:.95rem;margin-top:.4rem;font:700 1.05rem inherit;font-family:inherit;color:var(--limeInk);background:var(--lime);cursor:pointer;box-shadow:0 10px 28px -10px var(--lime);transition:transform .2s,box-shadow .2s,filter .2s}
.go:hover{transform:translateY(-2px);filter:brightness(1.06);box-shadow:0 16px 34px -10px var(--lime)}
.go:active{transform:scale(.96)}
.go:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.go[aria-busy=true]{pointer-events:none;filter:saturate(.7)}
.spin{display:none;width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(0,0,0,.25);border-top-color:var(--limeInk);animation:spin 0.7s linear infinite}
.go[aria-busy=true] .spin{display:block}
.theme{position:fixed;z-index:30;inset-block-start:calc(1.5rem + env(safe-area-inset-top,0px));inset-inline-end:1.25rem;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--ink);cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(8px)}
.theme svg{width:20px;height:20px}
/* intro */
.intro{position:fixed;inset:0;z-index:10;background:var(--bg);display:grid;place-items:center;transition:opacity .5s}
.intro.done{opacity:0;pointer-events:none}
.intro i{position:absolute;width:120px;height:120px;border-radius:50%;border:1.5px solid var(--lime);opacity:0;animation:ripple 1.1s ease-out forwards}
.intro i:nth-child(2){animation-delay:.2s;border-color:var(--coral)}.intro i:nth-child(3){animation-delay:.4s}
@keyframes ripple{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(5)}}
.skip{position:fixed;z-index:40;inset-block-end:calc(1.25rem + env(safe-area-inset-bottom,0px));inset-inline-start:50%;transform:translateX(50%);border:1px solid var(--line);background:var(--glass);color:var(--muted);font:inherit;font-size:.85rem;border-radius:99px;padding:.45rem 1rem;cursor:pointer}
.logo.pop{animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{opacity:0;scale:.5}}
.rv{opacity:0;transform:translateY(18px) scale(.98)}
.ready .rv{opacity:1;transform:none;transition:opacity .5s ease,transform .6s cubic-bezier(.2,.9,.3,1);transition-delay:calc(var(--i,0)*70ms)}
.ready .scene .chat,.ready .scene .orbits{opacity:1}
.scene .chat,.scene .orbits{opacity:0;transition:opacity 1s .3s}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.paused *{animation-play-state:paused!important}
.welcome{position:fixed;inset:0;z-index:50;display:none;place-items:center;text-align:center;background:var(--bg);font-size:1.3rem;font-weight:600}
.welcome.show{display:grid;animation:in .6s}
/* responsive */
@media (max-width:900px){
.stage{grid-template-columns:1fr;align-content:center;padding-top:5.5rem}
.scene{position:absolute;inset:0;min-height:0;opacity:.45;z-index:-1}
.scene .chat,.tag{display:none}
.cardwrap{z-index:2}.card{padding:1.5rem}
}
@media (max-width:420px){.card{border-radius:22px;padding:1.25rem}h1{font-size:1.4rem}}
@media (hover:none),(pointer:coarse){.layer{transform:none!important}.card{transform:none!important}.chat{animation-duration:12s}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}.layer,.card{transform:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<button class="theme" id="theme" type="button" aria-label="تبديل الوضع الليلي والنهاري">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>

<div class="intro" id="intro" aria-hidden="true"><i></i><i></i><i></i></div>
<button class="skip" id="skip" type="button">تخطي</button>

<div class="brand-wrap">
<div class="logo" id="logo">
<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="none" stroke="var(--lime)" stroke-width="2.5"/><circle cx="24" cy="24" r="8" fill="var(--lime)"/><circle cx="40" cy="14" r="4.5" fill="var(--coral)"/></svg>
<div><span>تواصل</span><small>TAWASOL</small></div>
</div>
</div>

<main class="stage" id="stage">
<section class="scene" aria-hidden="true">
<div class="layer" style="--d:-8">
<svg class="orbits" viewBox="0 0 800 800">
<circle class="ring" cx="400" cy="400" r="120"/><circle class="ring" cx="400" cy="400" r="200"/><circle class="ring" cx="400" cy="400" r="280"/>
<g class="orb" style="--t:38s"><polygon class="dash" points="520,400 340,504 340,296"/><circle class="nd" cx="520" cy="400" r="7"/><circle class="nd" cx="340" cy="504" r="5"/><circle class="nd c" cx="340" cy="296" r="6"/></g>
<g class="orb r" style="--t:62s"><polygon class="dash c" points="600,400 400,600 200,400 400,200"/><circle class="nd" cx="600" cy="400" r="6"/><circle class="nd c" cx="400" cy="600" r="8"/><circle class="nd" cx="200" cy="400" r="5"/><circle class="nd" cx="400" cy="200" r="6"/></g>
<g class="orb" style="--t:90s"><polygon class="dash" points="680,400 260,642 260,158"/><circle class="nd c" cx="680" cy="400" r="7"/><circle class="nd" cx="260" cy="642" r="9"/><circle class="nd" cx="260" cy="158" r="6"/></g>
<circle class="core" cx="400" cy="400" r="16"/>
</svg>
</div>
<div class="layer" style="--d:18">
<div class="chat" style="inset-block-start:14%;inset-inline-start:6%;--f:7s"><i></i><div><b style="--w:84px"></b><b style="--w:52px"></b></div></div>
<div class="chat c" style="inset-block-start:30%;inset-inline-end:2%;--f:9s;--fd:-2s"><i></i><div><b style="--w:64px"></b><span class="dots"><s></s><s></s><s></s></span></div></div>
<div class="chat" style="inset-block-end:24%;inset-inline-start:2%;--f:8s;--fd:-4s"><i></i><div><b style="--w:96px"></b><b style="--w:40px"></b></div></div>
<div class="chat c" style="inset-block-end:10%;inset-inline-end:12%;--f:10s;--fd:-1s"><i></i><div><b style="--w:70px"></b></div></div>
</div>
<p class="tag rv" style="--i:6">مساحة هادئة تجمعك بأصدقائك.</p>
</section>

<section class="cardwrap">
<div class="card rv" id="card" data-mode="login">
<div class="seg rv" id="seg" data-mode="login" role="tablist" style="--i:1">
<span class="pill"></span>
<button type="button" role="tab" id="tab-login" aria-selected="true" data-m="login">تسجيل الدخول</button>
<button type="button" role="tab" id="tab-signup" aria-selected="false" data-m="signup">حساب جديد</button>
</div>
<h1 class="sw" id="ttl">أهلاً بعودتك</h1>
<p class="sub sw" id="sub">سجّل دخولك لتكمل محادثاتك.</p>

<form id="form" novalidate>
<div class="alert" id="alert" role="alert"></div>

<div class="fold" id="nameFold" aria-hidden="true"><div>
<div class="field"><label for="name">الاسم</label>
<div class="box" id="bx-name"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
<input id="name" name="name" type="text" autocomplete="name" placeholder="اسمك" disabled tabindex="-1"></div>
<p class="msg" id="er-name"></p></div>
</div></div>

<div class="field rv" style="--i:2"><label for="email">البريد الإلكتروني</label>
<div class="box" id="bx-email"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
<input id="email" name="email" type="email" inputmode="email" autocomplete="username" placeholder="name@example.com" required></div>
<p class="msg" id="er-email"></p></div>

<div class="field rv" style="--i:3"><label for="pass">كلمة المرور</label>
<div class="box" id="bx-pass"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
<input id="pass" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
<button class="eye" id="eye" type="button" aria-label="إظهار كلمة المرور" aria-pressed="false">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path id="eyep" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path id="eyes" d="M4 4l16 16" style="display:none"/></svg></button></div>
<p class="msg" id="er-pass"></p></div>

<button class="go rv" style="--i:4" id="go" type="submit"><span class="spin" aria-hidden="true"></span><span id="goTxt">تسجيل الدخول</span></button>
<p class="sr" id="live" aria-live="polite"></p>
</form>
</div>
</section>
</main>

<div class="welcome" id="welcome">تم تسجيل الدخول بنجاح. (وضع التجربة: لا يوجد توجيه فعلي)</div>

<script>
(function(){
"use strict";
/* ===== إعدادات الربط بالخادم =====
   عرّف window.TAWASOL_AUTH قبل هذا السكربت لربطه بالمصادقة الحالية.
   اضبط demo:false وعدّل المسارات حسب الـ API لديك. */
var CFG=Object.assign({demo:true,session:"/api/auth/session",login:"/api/auth/login",register:"/api/auth/register",redirect:"/"},window.TAWASOL_AUTH||{});
var $=function(i){return document.getElementById(i)};
var root=document.documentElement,body=document.body;
var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
var fine=matchMedia("(hover:hover) and (pointer:fine)").matches;
var mode="login",busy=false;

/* الثيم */
try{var th=localStorage.getItem("tw_theme");if(th)root.setAttribute("data-theme",th)}catch(e){}
$("theme").onclick=function(){
  var cur=root.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");
  var nx=cur==="light"?"dark":"light";root.setAttribute("data-theme",nx);
  try{localStorage.setItem("tw_theme",nx)}catch(e){}
};

/* توقف الحركة عند إخفاء الصفحة */
document.addEventListener("visibilitychange",function(){root.classList.toggle("paused",document.hidden)});

/* الماوس: عمق وإضاءة تتبع المؤشر */
if(fine&&!reduce){
  var raf=0,px=0,py=0;
  addEventListener("pointermove",function(e){
    if(e.pointerType!=="mouse")return;px=e.clientX;py=e.clientY;
    if(raf)return;raf=requestAnimationFrame(function(){raf=0;
      var w=innerWidth,h=innerHeight;
      body.style.setProperty("--mx",((px/w)*2-1).toFixed(3));
      body.style.setProperty("--my",((py/h)*2-1).toFixed(3));
      body.style.setProperty("--lx",px+"px");body.style.setProperty("--ly",py+"px");
    });
  },{passive:true});
}

/* الاتصال بالخادم */
function api(url,data,method){
  return fetch(url,{method:method||"POST",credentials:"include",headers:{"Accept":"application/json","Content-Type":"application/json"},body:data?JSON.stringify(data):undefined})
  .then(function(r){return r.json().catch(function(){return {}}).then(function(j){return {ok:r.ok,status:r.status,data:j}})});
}
function demoAuth(kind,d){
  return new Promise(function(res){setTimeout(function(){
    if(kind==="login"&&d.password!=="demo1234")return res({ok:false,status:401,data:{}});
    res({ok:true,status:200,data:{}});
  },1100)});
}

/* الافتتاحية */
var intro=$("intro"),logo=$("logo"),introDone=false,timers=[];
function seen(){try{return localStorage.getItem("tw_intro")==="1"}catch(e){return false}}
function mark(){try{localStorage.setItem("tw_intro","1")}catch(e){}}
function finish(){
  if(introDone)return;introDone=true;timers.forEach(clearTimeout);
  logo.style.transition="";logo.style.transform="";logo.style.zIndex="";
  intro.classList.add("done");$("skip").style.display="none";
  body.classList.add("ready");mark();
  setTimeout(function(){intro.remove()},600);
}
function playIntro(){
  var r=logo.getBoundingClientRect();
  var dx=innerWidth/2-(r.left+r.width/2),dy=innerHeight/2-(r.top+r.height/2);
  logo.style.zIndex="20";logo.style.transform="translate("+dx+"px,"+dy+"px) scale(1.9)";
  logo.classList.add("pop");
  timers.push(setTimeout(function(){
    logo.style.transition="transform .6s cubic-bezier(.6,0,.2,1)";logo.style.transform="none";
    intro.classList.add("done");
  },1000));
  timers.push(setTimeout(function(){body.classList.add("ready")},1100));
  timers.push(setTimeout(finish,1950));
}
$("skip").onclick=finish;
function start(){
  if(reduce||seen()){introDone=true;intro.remove();$("skip").style.display="none";body.classList.add("ready");return}
  playIntro();
}
/* فحص الجلسة أولاً: المستخدم الصالح يدخل مباشرة */
function boot(){
  if(CFG.demo)return start();
  var done=false;
  var t=setTimeout(function(){if(!done){done=true;start()}},1500);
  api(CFG.session,null,"GET").then(function(r){
    if(done)return;done=true;clearTimeout(t);
    if(r.ok)location.replace(CFG.redirect);else start();
  }).catch(function(){if(!done){done=true;clearTimeout(t);start()}});
}

/* التبديل بين الدخول والتسجيل (نفس النموذج دون إعادة بناء) */
var copy={login:["أهلاً بعودتك","سجّل دخولك لتكمل محادثاتك.","تسجيل الدخول","current-password"],
          signup:["أنشئ حسابك","ابدأ بالتواصل مع أصدقائك خلال لحظات.","إنشاء الحساب","new-password"]};
function setMode(m){
  if(m===mode||busy)return;mode=m;
  $("card").dataset.mode=m;$("seg").dataset.mode=m;
  ["login","signup"].forEach(function(k){$("tab-"+k).setAttribute("aria-selected",k===m)});
  var c=copy[m],ts=[$("ttl"),$("sub")];
  ts.forEach(function(e){e.classList.add("out")});
  setTimeout(function(){$("ttl").textContent=c[0];$("sub").textContent=c[1];ts.forEach(function(e){e.classList.remove("out")})},200);
  $("goTxt").textContent=c[2];$("pass").autocomplete=c[3];
  var n=$("name"),on=m==="signup";n.disabled=!on;n.tabIndex=on?0:-1;$("nameFold").setAttribute("aria-hidden",!on);
  clearErrors();
}
document.querySelectorAll("[data-m]").forEach(function(b){b.onclick=function(){setMode(b.dataset.m)}});

/* إظهار/إخفاء كلمة المرور */
$("eye").onclick=function(){
  var p=$("pass"),show=p.type==="password";p.type=show?"text":"password";
  this.setAttribute("aria-pressed",show);this.setAttribute("aria-label",show?"إخفاء كلمة المرور":"إظهار كلمة المرور");
  $("eyes").style.display=show?"":"none";
  var pos=p.value.length;p.focus();try{p.setSelectionRange(pos,pos)}catch(e){}
};

/* الأخطاء */
function fieldErr(id,text){
  var m=$("er-"+id),b=$("bx-"+id);m.textContent=text;m.classList.add("show");b.classList.add("bad");
  $(id==="pass"?"pass":id).setAttribute("aria-invalid","true");
}
function clearErrors(){
  document.querySelectorAll(".msg").forEach(function(m){m.classList.remove("show");m.textContent=""});
  document.querySelectorAll(".box").forEach(function(b){b.classList.remove("bad")});
  document.querySelectorAll("input").forEach(function(i){i.removeAttribute("aria-invalid")});
  $("alert").classList.remove("show");
}
function shake(){var c=$("card");c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");c.addEventListener("animationend",function f(){c.classList.remove("shake");c.removeEventListener("animationend",f)})}
["email","pass","name"].forEach(function(id){
  var el=$(id);if(!el)return;
  el.addEventListener("input",function(){var b=$("bx-"+id),m=$("er-"+id);b.classList.remove("bad");m.classList.remove("show");$("alert").classList.remove("show")});
});
function validate(){
  clearErrors();var bad=null,em=$("email").value.trim(),pw=$("pass").value;
  if(mode==="signup"&&$("name").value.trim().length<2){fieldErr("name","اكتب اسمك (حرفان على الأقل).");bad=bad||"name"}
  if(!em){fieldErr("email","أدخل بريدك الإلكتروني.");bad=bad||"email"}
  else if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){fieldErr("email","صيغة البريد غير صحيحة.");bad=bad||"email"}
  if(!pw){fieldErr("pass","أدخل كلمة المرور.");bad=bad||"pass"}
  else if(mode==="signup"&&pw.length<8){fieldErr("pass","كلمة المرور 8 أحرف على الأقل.");bad=bad||"pass"}
  if(bad){$(bad).focus();shake();return false}
  return true;
}

/* الإرسال */
function setBusy(v){busy=v;var g=$("go");g.setAttribute("aria-busy",v);g.disabled=false;$("live").textContent=v?"جارٍ المعالجة":""}
$("form").addEventListener("submit",function(e){
  e.preventDefault();if(busy||!validate())return;
  setBusy(true);
  var d={email:$("email").value.trim(),password:$("pass").value};
  if(mode==="signup")d.name=$("name").value.trim();
  var req=CFG.demo?demoAuth(mode,d):api(mode==="login"?CFG.login:CFG.register,d);
  req.then(function(r){
    if(r.ok){return success()}
    var msg=(r.data&&r.data.message)||"";
    if(r.status===409)msg=msg||"هذا البريد مسجّل مسبقاً. جرّب تسجيل الدخول.";
    else if(r.status===429)msg=msg||"محاولات كثيرة. انتظر قليلاً ثم أعد المحاولة.";
    else if(r.status===401||r.status===400||r.status===403||r.status===422)msg=msg||(mode==="login"?"البريد أو كلمة المرور غير صحيحة. تحقق منهما وأعد المحاولة.":"تعذّر إنشاء الحساب. راجع بياناتك.");
    else msg=msg||"حدث خطأ في الخادم. أعد المحاولة بعد قليل.";
    fail(msg);
  }).catch(function(){fail("تعذّر الاتصال بالخادم. تحقق من الإنترنت وأعد المحاولة.")});
});
function fail(msg){
  setBusy(false);var a=$("alert");a.textContent=msg;a.classList.add("show");
  shake();$("pass").value="";$("pass").focus(); /* البريد يبقى كما كُتب */
}
function success(){
  var c=$("card");c.classList.add("leave");$("live").textContent="تم تسجيل الدخول";
  setTimeout(function(){
    if(CFG.demo){$("welcome").classList.add("show");setBusy(false);c.classList.remove("leave");
      setTimeout(function(){$("welcome").classList.remove("show")},2200);return}
    location.assign(CFG.redirect);
  },reduce?50:700);
}
boot();
})();
</script>
