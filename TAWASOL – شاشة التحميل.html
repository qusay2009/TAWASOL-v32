<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تواصل – جارٍ التحميل</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Tajawal:wght@800&display=swap">
<style>
:root{--bg:#1b0a21;--bg2:#2d1337;--ink:#fbf3ff;--muted:#bda8c9;--lime:#b8f24b;--coral:#ff6f61;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--glow:rgba(184,242,75,.3);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#faf5ea;--bg2:#efe4cf;--ink:#2b1234;--muted:#6c5778;--lime:#8fc41f;--coral:#f0584a;--glass:rgba(255,255,255,.65);--line:rgba(43,18,52,.16);--glow:rgba(120,170,20,.3);color-scheme:light}}
:root[data-theme="dark"]{--bg:#1b0a21;--bg2:#2d1337;--ink:#fbf3ff;--muted:#bda8c9;--lime:#b8f24b;--coral:#ff6f61;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--glow:rgba(184,242,75,.3);color-scheme:dark}
:root[data-theme="light"]{--bg:#faf5ea;--bg2:#efe4cf;--ink:#2b1234;--muted:#6c5778;--lime:#8fc41f;--coral:#f0584a;--glass:rgba(255,255,255,.65);--line:rgba(43,18,52,.16);--glow:rgba(120,170,20,.3);color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;min-height:100dvh;font-family:"IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden;--lx:50%;--ly:45%;--px:0;--py:0;transition:background .5s,color .5s}
.loader{position:fixed;inset:0;display:grid;place-items:center;padding:1.5rem;cursor:crosshair;touch-action:manipulation;background:radial-gradient(760px 540px at var(--lx) var(--ly),var(--glow),transparent 62%),radial-gradient(1100px 700px at 50% 120%,var(--bg2),transparent 65%),var(--bg);transition:opacity .7s,transform .8s cubic-bezier(.6,0,.3,1),filter .7s}
.loader.exit{opacity:0;transform:scale(1.15);filter:blur(12px);pointer-events:none}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.core{position:relative;display:grid;justify-items:center;gap:1.2rem;width:min(100%,360px);text-align:center}
.orbit{position:relative;width:min(80vw,310px);aspect-ratio:1;transform:perspective(700px) rotateY(calc(var(--px)*10deg)) rotateX(calc(var(--py)*-10deg));transition:transform .3s ease-out}
.orbit svg.o{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.track{fill:none;stroke:var(--line);stroke-width:1.5}.ring{fill:none;stroke:var(--line);stroke-width:1}
.pr{fill:none;stroke:var(--lime);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:880;stroke-dashoffset:880;transform:rotate(-90deg);transform-origin:150px 150px;filter:drop-shadow(0 0 7px var(--lime))}
#hd{transform-origin:150px 150px}#hd circle{fill:var(--coral);filter:drop-shadow(0 0 10px var(--coral))}
.g{transform-origin:150px 150px;animation:spin var(--t) linear infinite}.g.r{animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.ln{fill:none;stroke:var(--lime);stroke-width:1.2;opacity:.55;stroke-dasharray:3 8;animation:flow 5s linear infinite}.ln.c{stroke:var(--coral)}
@keyframes flow{to{stroke-dashoffset:-110}}
.nd{fill:var(--lime);filter:drop-shadow(0 0 6px var(--lime))}.nd.c{fill:var(--coral);filter:drop-shadow(0 0 6px var(--coral))}
.mark{position:absolute;inset:0;display:grid;place-items:center}
.mark svg{width:34%;overflow:visible;filter:drop-shadow(0 0 16px var(--glow));transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.orbit:hover .mark svg{transform:scale(1.12) rotate(-4deg)}
.mark.ping svg{animation:ping .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes ping{40%{transform:scale(1.28) rotate(6deg)}}
.lb{fill:none;stroke:var(--lime);stroke-width:3.5;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1s .1s ease-out forwards}
.ll{stroke:var(--lime);stroke-width:2;stroke-linecap:round;opacity:.7;stroke-dasharray:1;stroke-dashoffset:1;animation:dr .5s .9s ease-out forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.d1,.d2{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.8,.5,1) both}.d1{fill:var(--lime);animation-delay:.7s}.d2{fill:var(--coral);animation-delay:.85s}
@keyframes pop{from{transform:scale(0)}}
.pd{fill:#fff;animation:trav 2.2s 1.5s ease-in-out infinite;opacity:0}
@keyframes trav{0%{transform:translate(23px,27px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(41px,33px);opacity:0}}
.word{font-family:Tajawal,"IBM Plex Sans Arabic",sans-serif;font-weight:800;font-size:1.9rem;line-height:1}
.word small{display:block;font:500 .7rem "IBM Plex Sans Arabic",sans-serif;letter-spacing:.38em;color:var(--muted);margin-top:.45rem;direction:ltr}
.row{display:flex;justify-content:space-between;align-items:baseline;width:100%;font-size:.95rem;color:var(--muted)}
.row b{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;font-size:1.2rem;min-width:3.5ch;text-align:end}
#st{transition:opacity .25s,transform .25s}#st.out{opacity:0;transform:translateY(5px)}
.hint{margin:0;font-size:.8rem;color:var(--muted);opacity:.8;transition:opacity .5s}.hint.off{opacity:0}
.chat{position:absolute;display:flex;gap:.5rem;align-items:center;padding:.55rem .7rem;border-radius:14px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);translate:calc(var(--px)*var(--d)*1px) calc(var(--py)*var(--d)*1px);animation:fl var(--f) ease-in-out infinite;transition:translate .3s ease-out}
@keyframes fl{50%{transform:translateY(-12px)}}
.chat i{width:22px;height:22px;border-radius:50%;background:var(--lime)}.chat.c i{background:var(--coral)}
.chat b{display:block;height:5px;width:var(--w);border-radius:3px;background:var(--line);margin:3px 0}
.chat s{display:inline-block;width:5px;height:5px;margin-inline-end:3px;border-radius:50%;background:var(--ink);opacity:.5;animation:bl 1.1s infinite}.chat s:nth-child(2){animation-delay:.2s}.chat s:nth-child(3){animation-delay:.4s}
@keyframes bl{50%{opacity:1;transform:translateY(-3px)}}
.rp{position:fixed;width:20px;height:20px;margin:-10px;border-radius:50%;border:2px solid var(--lime);pointer-events:none;animation:rp .8s ease-out forwards}
@keyframes rp{to{transform:scale(7);opacity:0}}
.app{position:fixed;inset:0;display:none;place-items:center;align-content:center;gap:1rem;text-align:center}
.app.show{display:grid;animation:in .6s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.btn{border:1px solid var(--line);background:var(--glass);color:var(--ink);font:inherit;border-radius:99px;padding:.55rem 1.2rem;cursor:pointer}.btn:hover{border-color:var(--lime)}
.btn:focus-visible,.theme:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.theme{position:fixed;z-index:5;inset-block-start:calc(1.25rem + env(safe-area-inset-top,0px));inset-inline-end:1.25rem;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.theme svg{width:20px;height:20px}
.paused *{animation-play-state:paused!important}
@media (max-width:700px){.chat{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.orbit{transform:none}}
</style>
</head>
<body>
<button class="theme" id="theme" type="button" aria-label="تبديل الوضع الليلي والنهاري"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>

<main class="loader" id="loader" role="status" aria-live="polite" aria-busy="true">
<canvas id="cv" aria-hidden="true"></canvas>
<div class="chat" style="inset-block-start:22%;inset-inline-start:11%;--f:7s;--d:-14"><i></i><div><b style="--w:64px"></b><b style="--w:38px"></b></div></div>
<div class="chat c" style="inset-block-start:34%;inset-inline-end:10%;--f:9s;--d:18"><i></i><div><b style="--w:54px"></b><span><s></s><s></s><s></s></span></div></div>
<div class="chat c" style="inset-block-end:20%;inset-inline-start:14%;--f:8s;--d:12"><i></i><div><b style="--w:80px"></b></div></div>
<div class="chat" style="inset-block-end:26%;inset-inline-end:15%;--f:10s;--d:-10"><i></i><div><b style="--w:58px"></b><b style="--w:34px"></b></div></div>

<div class="core">
<div class="orbit" id="orbit" aria-hidden="true">
<svg class="o" viewBox="0 0 300 300">
<circle class="track" cx="150" cy="150" r="140"/><circle class="ring" cx="150" cy="150" r="70"/><circle class="ring" cx="150" cy="150" r="110"/>
<g class="g" style="--t:14s"><polygon class="ln" points="220,150 115,210.6 115,89.4"/><circle class="nd" cx="220" cy="150" r="5"/><circle class="nd c" cx="115" cy="210.6" r="4"/><circle class="nd" cx="115" cy="89.4" r="4"/></g>
<g class="g r" style="--t:24s"><polygon class="ln c" points="260,150 150,260 40,150 150,40"/><circle class="nd c" cx="260" cy="150" r="5"/><circle class="nd" cx="150" cy="260" r="6"/><circle class="nd" cx="40" cy="150" r="4"/><circle class="nd c" cx="150" cy="40" r="4"/></g>
<circle class="pr" id="pr" cx="150" cy="150" r="140"/>
<g id="hd"><circle cx="290" cy="150" r="6"/></g>
</svg>
<div class="mark" id="mark"><svg viewBox="0 0 64 64" fill="none">
<path class="lb" pathLength="1" d="M32 6A24 24 0 1 1 20.5 51L9 56L13.5 44.8A24 24 0 0 1 32 6Z"/>
<path class="ll" pathLength="1" d="M23 27L41 33"/>
<circle class="d1" cx="23" cy="27" r="5.5"/><circle class="d2" cx="41" cy="33" r="5.5"/><circle class="pd" cx="0" cy="0" r="2.2"/>
</svg></div>
</div>
<div class="word">تواصل<small>TAWASOL</small></div>
<div class="row"><span id="st">نجهّز مساحتك</span><b id="pc">0%</b></div>
<p class="hint" id="hint">المس أي مكان لإرسال نبضة</p>
</div>
</main>

<div class="app" id="app"><div style="font-size:1.3rem;font-weight:600">اكتمل التحميل</div><div style="color:var(--muted)">هنا تظهر المنصة (وضع التجربة)</div><button class="btn" id="replay" type="button">إعادة العرض</button></div>

<script>
(function(){
"use strict";
/* تلقائي: ينتهي بعد window.load وبحد أدنى للمدة.
   يدوي: window.TAWASOL_LOADER={auto:false} ثم TawasolLoader.set(60) و TawasolLoader.done().
   عند الانتهاء يُطلق الحدث "tawasol:ready" على document. */
var CFG=Object.assign({auto:true,min:2000,demo:true},window.TAWASOL_LOADER||{});
var $=function(i){return document.getElementById(i)},root=document.documentElement,body=document.body;
var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
var fine=matchMedia("(hover:hover) and (pointer:fine)").matches;
var cur=0,target=0,finished=false,t0=0,tick=0,lastIdx=-1;
var msgs=[[0,"نجهّز مساحتك"],[30,"نربط الاتصال"],[60,"نحمّل محادثاتك"],[90,"جاهز تقريباً"]];

try{var th=localStorage.getItem("tw_theme");if(th)root.setAttribute("data-theme",th)}catch(e){}
$("theme").onclick=function(e){
  e.stopPropagation();
  var c=root.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"),n=c==="light"?"dark":"light";
  root.setAttribute("data-theme",n);try{localStorage.setItem("tw_theme",n)}catch(e){}
  setTimeout(readColors,60);
};
document.addEventListener("visibilitychange",function(){root.classList.toggle("paused",document.hidden)});

/* ===== شبكة جسيمات تفاعلية ===== */
var cv=$("cv"),cx=cv.getContext("2d"),W=0,H=0,dpr=1,P=[],B=[],ptr={x:-999,y:-999,on:false},col={l:"#b8f24b",c:"#ff6f61"};
function readColors(){var s=getComputedStyle(root);col.l=s.getPropertyValue("--lime").trim()||col.l;col.c=s.getPropertyValue("--coral").trim()||col.c}
function resize(){
  dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  var n=W<700?22:(matchMedia("(pointer:coarse)").matches?34:56);P=[];
  for(var i=0;i<n;i++)P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:1+Math.random()*1.8,c:Math.random()<.25?"c":"l"});
}
function burst(x,y,n){if(reduce)return;for(var i=0;i<n;i++){var a=Math.random()*6.283,s=1+Math.random()*3;B.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,c:Math.random()<.4?"c":"l"})}}
function draw(){
  cx.clearRect(0,0,W,H);
  var i,j,p,q,dx,dy,d;
  for(i=0;i<P.length;i++){
    p=P[i];p.x+=p.vx;p.y+=p.vy;
    if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
    if(ptr.on){dx=ptr.x-p.x;dy=ptr.y-p.y;d=Math.hypot(dx,dy);if(d<170&&d>1){p.x+=dx/d*.9;p.y+=dy/d*.9;cx.globalAlpha=(1-d/170)*.55;cx.strokeStyle=col.l;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(ptr.x,ptr.y);cx.stroke()}}
    for(j=i+1;j<P.length;j++){q=P[j];dx=p.x-q.x;dy=p.y-q.y;d=dx*dx+dy*dy;
      if(d<12100){cx.globalAlpha=(1-d/12100)*.3;cx.strokeStyle=col.l;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(q.x,q.y);cx.stroke()}}
    cx.globalAlpha=.8;cx.fillStyle=col[p.c];cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill();
  }
  for(i=B.length-1;i>=0;i--){p=B[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.95;p.vy*=.95;p.life-=.025;
    if(p.life<=0){B.splice(i,1);continue}
    cx.globalAlpha=p.life;cx.fillStyle=col[p.c];cx.beginPath();cx.arc(p.x,p.y,2.2,0,6.283);cx.fill()}
  cx.globalAlpha=1;
}

/* ===== التفاعل ===== */
var raf=0,mx=0,my=0;
if(fine&&!reduce){
  addEventListener("pointermove",function(e){
    if(e.pointerType!=="mouse")return;mx=e.clientX;my=e.clientY;ptr.x=mx;ptr.y=my;ptr.on=true;
    if(raf)return;raf=requestAnimationFrame(function(){raf=0;
      body.style.setProperty("--lx",mx+"px");body.style.setProperty("--ly",my+"px");
      body.style.setProperty("--px",((mx/innerWidth)*2-1).toFixed(3));body.style.setProperty("--py",((my/innerHeight)*2-1).toFixed(3));
    });
  },{passive:true});
  document.addEventListener("pointerleave",function(){ptr.on=false});
}
$("loader").addEventListener("pointerdown",function(e){
  if(e.target.closest(".theme"))return;
  burst(e.clientX,e.clientY,22);
  var r=document.createElement("span");r.className="rp";r.style.left=e.clientX+"px";r.style.top=e.clientY+"px";
  body.appendChild(r);setTimeout(function(){r.remove()},850);
  $("hint").classList.add("off");ping();
  if("vibrate" in navigator&&e.pointerType==="touch")try{navigator.vibrate(12)}catch(x){}
});
function ping(){var m=$("mark");m.classList.remove("ping");void m.offsetWidth;m.classList.add("ping")}
function center(){var r=$("orbit").getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2]}

/* ===== التقدّم ===== */
function render(){
  var p=Math.round(cur);
  $("pr").style.strokeDashoffset=880*(1-cur/100);$("hd").style.transform="rotate("+(cur*3.6-90)+"deg)";
  $("pc").textContent=p+"%";
  var i=0;msgs.forEach(function(m,k){if(p>=m[0])i=k});
  if(i!==lastIdx){
    var first=lastIdx<0;lastIdx=i;
    var s=$("st");s.classList.add("out");setTimeout(function(){s.textContent=msgs[i][1];s.classList.remove("out")},180);
    if(!first){ping();var c=center();burst(c[0],c[1],26)}
  }
}
function loop(){
  if(!document.hidden){
    if(CFG.auto&&!finished){var el=performance.now()-t0;target=Math.max(target,Math.min(90,90*(1-Math.exp(-el/1000))))}
    cur+=(target-cur)*.1;if(target-cur<.15)cur=target;
    render();if(!reduce)draw();
    if(finished&&cur>=100){return end()}
  }
  tick=requestAnimationFrame(loop);
}
function end(){
  var c=center();burst(c[0],c[1],60);ping();
  var f=function(){if(B.length&&!reduce){draw();requestAnimationFrame(f)}};f();
  setTimeout(function(){
    $("loader").classList.add("exit");$("loader").setAttribute("aria-busy","false");
    document.dispatchEvent(new CustomEvent("tawasol:ready"));
    setTimeout(function(){$("loader").style.display="none";if(CFG.demo)$("app").classList.add("show")},reduce?50:800);
  },reduce?0:450);
}
var api={
  set:function(p){target=Math.max(target,Math.min(99,+p||0))},
  done:function(){finished=true;target=100},
  show:function(){
    cancelAnimationFrame(tick);finished=false;cur=0;target=0;lastIdx=-1;t0=performance.now();
    $("app").classList.remove("show");var l=$("loader");l.style.display="";void l.offsetWidth;l.classList.remove("exit");l.setAttribute("aria-busy","true");
    $("hint").classList.remove("off");loop();if(CFG.auto)autoFinish();
  }
};
window.TawasolLoader=api;
function autoFinish(){
  var s=performance.now();
  function go(){setTimeout(api.done,Math.max(0,CFG.min-(performance.now()-s)))}
  if(document.readyState==="complete")go();else addEventListener("load",go,{once:true});
}
$("replay").onclick=api.show;
var rt;addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(resize,150)});
readColors();resize();api.show();
})();
</script>
</body>
</html>
