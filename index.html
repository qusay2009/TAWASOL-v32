<header><button class="mobile" onclick="document.querySelector('.side').classList.toggle('open')" aria-label="فتح القائمة">☰</button><a class="brand" onclick="go('home')" role="button" aria-label="تواصل الرئيسية"><span class="brand-logo-icon"><svg class="tawasol-logo-svg" viewBox="0 0 64 64" fill="none"><path class="a-b" pathLength="1" d="M32 6A24 24 0 1 1 20.5 51L9 56L13.5 44.8A24 24 0 0 1 32 6Z"/><path class="a-l" pathLength="1" d="M23 27L41 33"/><circle class="a-1" cx="23" cy="27" r="5.5"/><circle class="a-2" cx="41" cy="33" r="5.5"/><circle class="a-t" r="2.2"/></svg></span><span class="brand-text"><span class="brand-title">تواصل</span><span class="brand-sub">TAWASOL</span></span></a><form class="search" onsubmit="event.preventDefault();query=this.q.value;go('search')"><input name="q" placeholder="⌕  ابحث عن أشخاص، منشورات، ومجتمعات…" aria-label="البحث"></form><div class="head-actions"><button id="adminHeaderBtn" class="admin-head-btn" onclick="go('admin')" aria-label="وضع الأدمن" title="وضع الأدمن">🛡️ <span>الأدمن</span></button><button onclick="theme()" aria-label="تبديل المظهر">◐</button><button onclick="go('notifications')" aria-label="الإشعارات">♧</button><button onclick="go('messages')" aria-label="الرسائل">✉</button><span id="headUser"></span></div></header>
<div class="layout"><aside class="side"><div id="mini"></div><nav class="nav" id="nav"></nav><div class="divider"></div><button onclick="go('settings')">⚙ الإعدادات والخصوصية</button><button onclick="logout()" class="danger">⇥ تسجيل الخروج</button><div class="hint" style="margin-top:25px"><b>مساحتك، بطريقتك ✦</b><p>شارك أفكارك واكتشف أشخاصًا يلهمونك كل يوم.</p></div></aside><main id="main"></main><aside class="right" id="right"></aside></div><dialog id="modal"></dialog><div id="toast" role="status"></div>
<script>
'use strict';
// Local prototype only. All persisted user content is escaped before rendering.
const KEY='tawasol-v1', $=s=>document.querySelector(s), uid=()=>crypto.randomUUID(), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial={users:[],posts:[],groups:[],messages:[],reports:[],notifications:[],rooms:[],settings:{}};
let db=structuredClone(initial), current=null,page='home',query='',filter='all',profileId=null,chatId=null,roomId=null;
const user=id=>db.users.find(u=>u.id===id), me=()=>user(current), can=p=>me()&&(me().role==='super'||me().role==='admin'&&me().permissions?.includes(p));
function save(){return false}
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('#toast').style.display='none',3200)}
function avatar(u,cls=''){return '<span class="avatar '+cls+'">'+(u?.photo?'<img src="'+esc(u.photo)+'" alt="">':esc(u?.name?.slice(0,1)||'؟'))+'</span>'}
function modal(html){$('#modal').innerHTML='<button class="close" onclick="closeModal()" aria-label="إغلاق">✕</button>'+html;$('#modal').showModal()}function closeModal(){$('#modal').close()}
function go(p,id){page=p;if(id)profileId=id;document.querySelector('.side').classList.remove('open');render();window.scrollTo(0,0)}
function theme(){document.body.classList.toggle('dark');localStorage.setItem('tawasol-theme',document.body.classList.contains('dark')?'dark':'light')}
if(localStorage.getItem('tawasol-theme')==='dark')document.body.classList.add('dark');
function render(){if(!me()||!me().active){auth();return}$('#headUser').innerHTML='<button class="row" onclick="go(\'profile\',current)">'+avatar(me())+'<span class="head-name">'+esc(me().name)+'</span></button>';$('#mini').innerHTML='<div class="row" style="padding:0 12px 22px">'+avatar(me())+'<div><b>'+esc(me().name)+'</b><div class="muted">@'+esc(me().email.split('@')[0])+'</div></div></div>';
const items=[['home','⌂','الرئيسية'],['profile','◉','ملفي الشخصي'],['friends','♧','الأصدقاء والمتابعون'],['messages','✉','الرسائل'],['notifications','♧','الإشعارات'],['groups','▦','المجموعات'],['watch','▷','شاهد مع أصدقائك'],['search','⌕','استكشاف']];if(me().email==='qsyashrfalryaty@gmail.com')items.push(['admin','◫','لوحة الإدارة 🛡️']);
$('#nav').innerHTML=items.map(([p,i,t])=>'<button class="'+(page===p?'active':'')+'" onclick="go(\''+p+'\''+(p==='profile'?',current':'')+')"><i>'+i+'</i>'+t+(p==='watch'?'<small>جديد</small>':'')+'</button>').join('');
$('#right').innerHTML='<div class="card"><div class="row between"><h2>أشخاص قد تعرفهم</h2><span class="muted">✦</span></div>'+db.users.filter(u=>u.id!==current&&u.active).slice(0,3).map(person).join('')+'<button style="width:100%;color:var(--blue)" onclick="go(\'friends\')">اكتشف المزيد ←</button></div><div class="card"><h2>مجتمعات تستحق المتابعة</h2>'+db.groups.slice(0,3).map(g=>'<div class="row person"><span class="group-icon">'+g.icon+'</span><div class="grow"><b>'+esc(g.name)+'</b><div class="muted">'+g.members.length+' أعضاء · مجتمع نشط</div></div><button onclick="go(\'groups\')">‹</button></div>').join('')+'</div><div class="card"><div class="row"><span class="group-icon">▷</span><b>اللحظات أحلى معًا</b></div><p class="muted">فيديو واحد، أصدقاء كثيرون.<br>أنشئ غرفة المشاهدة الخاصة بك.</p><button class="primary" style="width:100%" onclick="go(\'watch\')">ابدأ المشاهدة الجماعية</button></div><div class="footer">الخصوصية · الشروط · عن تواصل<br>© 2026 TAWASOL · صُنع لنجتمع<br>نسخة بخادم · حسابات مستقلة</div>';
const routes={home:home,profile:profile,friends:friends,messages:messages,notifications:notifications,groups:groups,watch:watch,search:search,admin:admin,settings:settings};$('#main').innerHTML=(routes[page]||home)()}
function person(u){return '<div class="row person"><button style="padding:0" onclick="go(\'profile\',\''+u.id+'\')">'+avatar(u)+'</button><div class="grow"><b>'+esc(u.name)+'</b><div class="muted">'+esc(u.bio||'عضو في تواصل').slice(0,30)+'</div></div><button class="follow" onclick="follow(\''+u.id+'\')">'+(me().following.includes(u.id)?'متابَع ✓':'+ متابعة')+'</button></div>'}
function follow(id){me().following=me().following.includes(id)?me().following.filter(x=>x!==id):[...me().following,id];save();render()}
function heading(t,s){return '<div class="welcome"><div><h1>'+t+'</h1><div class="muted">'+s+'</div></div><span class="pill"><span class="dot"></span> حساب مفعّل</span></div>'}
function home(){return heading('صباح الأفكار الجميلة ☀','مساحة تجمعك بأصدقائك، وأفكار تستحق المشاركة')+'<div class="card hero"><span class="pill" style="background:#fff9">أهلًا بك في تواصل</span><h2 style="font-size:23px;margin:12px 0 0">كل فكرة بداية حكاية.</h2><p>شارك لحظاتك، اكتشف شغفك، وكن جزءًا من مجتمع يشبهك.</p><button onclick="go(\'groups\')">اكتشف المجتمعات ←</button></div>'+composer()+'<div class="row between"><div class="tabs"><button class="'+(filter==='all'?'active':'')+'" onclick="filter=\'all\';render()">لك</button><button class="'+(filter==='following'?'active':'')+'" onclick="filter=\'following\';render()">أتابعهم</button></div><span class="muted">الأحدث أولًا ≡</span></div>'+postList(db.posts.filter(p=>filter==='all'||me().following.includes(p.author)||p.author===current))}
function composer(){return '<form class="card compose" onsubmit="publish(event)"><div class="row">'+avatar(me())+'<textarea name="text" maxlength="5000" placeholder="بماذا تفكر يا '+esc(me().name.split(' ')[0])+'؟"></textarea></div><div class="divider"></div><div class="row between"><label class="file">▧ إضافة صورة<input name="photo" type="file" accept="image/png,image/jpeg,image/webp" onchange="this.parentElement.lastElementChild.textContent=this.files[0]?.name||\'\'"><span></span></label><span class="muted">◉ عام</span><button class="primary" type="submit">نشر ←</button></div></form>'}
async function readImage(f){if(!f)return '';if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>1500000)throw Error('اختر صورة PNG أو JPG أو WebP أصغر من 1.5MB');return new Promise((r,j)=>{const fr=new FileReader;fr.onload=()=>r(fr.result);fr.onerror=j;fr.readAsDataURL(f)})}
async function publish(e){e.preventDefault();const f=e.target;try{const image=await readImage(f.photo.files[0]);if(!f.text.value.trim()&&!image)return toast('اكتب منشورًا أو أضف صورة');db.posts.unshift({id:uid(),author:current,text:f.text.value.trim(),image,likes:[],comments:[],time:Date.now()});save();render();toast('تم نشر فكرتك ✨')}catch(e){toast(e.message)}}
function postList(ps){return ps.length?ps.map(post).join(''):'<div class="card empty">لا توجد منشورات بعد. كن أول من يشارك ✦</div>'}
function post(p){const u=user(p.author);if(!u)return '';return '<article class="card"><div class="row">'+avatar(u)+'<div class="grow"><button style="padding:0;font-weight:bold" onclick="go(\'profile\',\''+u.id+'\')">'+esc(u.name)+'</button> <span class="badge">✓</span><div class="muted">'+new Date(p.time).toLocaleDateString('ar-JO')+' · ◉ عام</div></div>'+(p.author===current||can('content')?'<button aria-label="حذف المنشور" onclick="deletePost(\''+p.id+'\')">⌫</button>':'<button aria-label="الإبلاغ" onclick="report(\''+p.id+'\')">⚑</button>')+'</div><p class="post-text">'+esc(p.text)+'</p>'+(p.image?'<img class="post-img" src="'+esc(p.image)+'" alt="صورة المنشور">':'')+(p.art?'<div class="art"><div><span style="font-size:11px;letter-spacing:3px">DESIGN SOMETHING</span><br><strong>أفكار بسيطة.<br>أثر مختلف.</strong><br><small>مساحة للإبداع، بلا حدود</small></div><div class="orb"></div></div>':'')+'<div class="row between muted" style="margin-top:14px"><span>♡ '+p.likes.length+' إعجاب</span><span>'+p.comments.length+' تعليق</span></div><div class="post-actions"><button class="'+(p.likes.includes(current)?'liked':'')+'" onclick="like(\''+p.id+'\')">♡ أعجبني</button><button onclick="comment(\''+p.id+'\')">☏ تعليق</button><button onclick="sharePost(\''+p.id+'\')">↗ مشاركة</button></div>'+p.comments.map((c,i)=>'<div class="comment"><b>'+esc(user(c.author)?.name||'مستخدم محذوف')+'</b> '+esc(c.text)+(c.author===current||can('content')?'<button class="danger" onclick="deleteComment(\''+p.id+'\','+i+')">×</button>':'')+'</div>').join('')+'</article>'}
function like(id){let p=db.posts.find(p=>p.id===id);p.likes=p.likes.includes(current)?p.likes.filter(x=>x!==current):[...p.likes,current];save();render()}
function comment(id){modal('<h2>أضف تعليقًا</h2><form onsubmit="event.preventDefault();addComment(\''+id+'\',this.text.value)"><textarea name="text" required maxlength="1000"></textarea><button class="primary">إرسال</button></form>')}
function addComment(id,t){if(!t.trim())return;db.posts.find(p=>p.id===id).comments.push({author:current,text:t.trim()});save();closeModal();render()}
function deleteComment(id,i){if(!confirm('حذف هذا التعليق؟'))return;let p=db.posts.find(p=>p.id===id);if(p.comments[i].author!==current&&!can('content'))return;p.comments.splice(i,1);save();render()}
function deletePost(id){const p=db.posts.find(p=>p.id===id);if(!p||p.author!==current&&!can('content'))return;if(confirm('هل تريد حذف المنشور نهائيًا؟')){db.posts=db.posts.filter(p=>p.id!==id);save();render();toast('حُذف المنشور')}}
function report(id){modal('<h2>الإبلاغ عن منشور</h2><form onsubmit="event.preventDefault();db.reports.push({id:uid(),post:\''+id+'\',by:current,reason:this.reason.value,status:\'pending\'});save();closeModal();toast(\'تم إرسال البلاغ للمراجعة\')"><select name="reason"><option>محتوى غير مناسب</option><option>إساءة أو تنمر</option><option>معلومات مضللة</option><option>رسائل مزعجة</option></select><button class="primary">إرسال البلاغ</button></form>')}
async function sharePost(id){const p=db.posts.find(p=>p.id===id);try{await navigator.clipboard.writeText(p.text);toast('تم نسخ نص المنشور للمشاركة')}catch{modal('<h2>نسخ المنشور</h2><textarea readonly>'+esc(p.text)+'</textarea>')}}
function profile(){const u=user(profileId||current);if(!u)return '<div class="empty">الحساب غير موجود</div>';return '<div class="card"><div class="cover" '+(u.cover?'style="background-image:url('+esc(u.cover)+')"':'')+'></div>'+avatar(u,'profile-avatar')+'<div class="row between"><div><h1>'+esc(u.name)+'</h1><p>'+esc(u.bio||'مرحبًا في مساحتي')+'</p><span class="muted">'+u.following.length+' يتابع · '+db.users.filter(x=>x.following.includes(u.id)).length+' متابع</span></div>'+(u.id===current?'<button class="primary" onclick="editProfile()">تعديل الملف</button>':'<button class="primary" onclick="chatId=\''+u.id+'\';go(\'messages\')">مراسلة</button>')+'</div></div><h2>المنشورات</h2>'+postList(db.posts.filter(p=>p.author===u.id))}
function editProfile(){modal('<h2>تعديل الملف الشخصي</h2><form onsubmit="updateProfile(event)"><label>الاسم<input name="name" required maxlength="60" value="'+esc(me().name)+'"></label><label>نبذة<textarea name="bio" maxlength="250">'+esc(me().bio)+'</textarea></label><label>الصورة الشخصية<input type="file" name="photo" accept="image/png,image/jpeg,image/webp"></label><label>صورة الغلاف<input type="file" name="cover" accept="image/png,image/jpeg,image/webp"></label><button class="primary">حفظ التغييرات</button></form>')}
async function updateProfile(e){e.preventDefault();try{const f=e.target,p=await readImage(f.photo.files[0]),c=await readImage(f.cover.files[0]);me().name=f.elements.name.value.trim()||me().name;me().bio=f.bio.value;if(p)me().photo=p;if(c)me().cover=c;save();closeModal();render();toast('تم تحديث الملف')}catch(e){toast(e.message)}}
function friends(){return heading('دوائرك تكبر هنا','تعرّف على أشخاص يشاركونك الاهتمام')+'<div class="card">'+db.users.filter(u=>u.id!==current&&u.active).map(person).join('')+'</div>'}
function messages(){const peers=db.users.filter(u=>u.id!==current&&u.active);if(!peers.some(u=>u.id===chatId))chatId=peers[0]?.id;return heading('الرسائل','محادثاتك في مكان واحد')+'<div class="card"><select onchange="chatId=this.value;render()">'+peers.map(u=>'<option value="'+u.id+'" '+(u.id===chatId?'selected':'')+'>'+esc(u.name)+'</option>').join('')+'</select><div class="chatlog">'+(db.messages.filter(m=>(m.from===current&&m.to===chatId)||(m.to===current&&m.from===chatId)).map(m=>'<p class="comment"><b>'+esc(user(m.from)?.name)+'</b><br>'+esc(m.text)+'</p>').join('')||'<div class="empty">ابدأ محادثة جديدة 👋</div>')+'</div><form class="row" onsubmit="sendMessage(event)"><input name="text" required maxlength="2000" placeholder="اكتب رسالتك…"><button class="primary">إرسال</button></form><p class="notice">الرسائل متاحة لطرفي المحادثة فقط.</p></div>'}
function sendMessage(e){e.preventDefault();if(!chatId||!e.target.text.value.trim())return;db.messages.push({id:uid(),from:current,to:chatId,text:e.target.text.value.trim()});db.notifications.push({id:uid(),to:chatId,text:'رسالة جديدة من '+me().name,read:false});save();render()}
function notifications(){
  const ns=db.notifications.filter(n=>n.to===current).slice().reverse();
  const hasUnread=ns.some(n=>!n.read);
  return heading('الإشعارات','كل جديد من أصدقائك وعالمك')+
    '<div class="card">'+
    (ns.length?'<div class="row between" style="margin-bottom:14px"><span class="muted">'+ns.length+' إشعار</span>'+(hasUnread?'<button class="quiet" onclick="act(\'readNotifications\',{}).then(()=>{db.notifications.filter(n=>n.to===current).forEach(n=>n.read=true);render()})">✓ تحديد الكل كمقروء</button>':'')+' </div>':'')+
    (ns.length?ns.map(n=>{
      const isFollowReq=n.type==='followRequest';
      const isFollowAcc=n.type==='followAccepted';
      const isMsg=n.text&&n.text.includes('رسالة جديدة');
      const iconBadge=isFollowReq?'👤':(isFollowAcc?'✓':(isMsg?'💬':'✦'));
      let actions='';
      if(isFollowReq&&n.fromId){
        actions='<div class="row" style="gap:6px;margin-top:10px">'+
          '<button class="primary" style="padding:7px 16px;font-size:12px" onclick="acceptFollow(\''+n.fromId+'\')">قبول الطلب</button>'+
          '<button class="quiet" style="padding:7px 14px;font-size:12px;border:1px solid var(--line)" onclick="rejectFollow(\''+n.fromId+'\')">رفض</button>'+
          '</div>';
      } else if(isFollowAcc){
        actions='<button class="quiet" style="padding:6px 14px;font-size:12px;border:1px solid var(--line);margin-top:8px" onclick="go(\'friends\')">عرض الأصدقاء</button>';
      } else if(isMsg){
        actions='<button class="quiet" style="padding:6px 14px;font-size:12px;border:1px solid var(--line);margin-top:8px" onclick="go(\'messages\')">فتح المحادثة</button>';
      }
      return '<div class="card" style="margin-bottom:12px;padding:14px;border-color:'+(n.read?'var(--line)':'var(--blue)')+';background:'+(n.read?'var(--card)':'var(--soft)')+'">'+
        '<div class="row" style="gap:12px;align-items:flex-start">'+
        '<span style="font-size:22px;width:38px;height:38px;display:grid;place-items:center;background:var(--plum);border-radius:50%;flex-shrink:0">'+iconBadge+'</span>'+
        '<div class="grow"><b style="font-size:13px">'+esc(n.text)+'</b>'+(n.time?'<div class="muted" style="font-size:11px;margin-top:3px">'+new Date(n.time).toLocaleTimeString('ar-JO',{hour:'2-digit',minute:'2-digit'})+'</div>':'')+actions+'</div>'+
        '</div></div>';
    }).join(''):
    '<div class="empty"><div class="empty-symbol">🔔</div>أنت على اطلاع بكل شيء ✨<br><small class="muted">ستصلك هنا إشعارات الطلبات والرسائل فور حدوثها</small></div>')+
    '</div>';
}
function groups(){return heading('مجتمعات تجمعنا','لكل شغف، مكان')+'<button class="primary" style="margin-bottom:20px" onclick="newGroup()">+ إنشاء مجتمع</button>'+db.groups.map(g=>'<div class="card"><div class="row"><span class="group-icon">'+g.icon+'</span><div class="grow"><h2 style="margin:0">'+esc(g.name)+'</h2><p class="muted">'+esc(g.desc)+' · '+g.members.length+' أعضاء</p></div><button class="primary" onclick="joinGroup(\''+g.id+'\')">'+(g.members.includes(current)?'مغادرة':'انضمام')+'</button>'+(me().role==='super'?'<button class="danger" onclick="deleteGroup(\''+g.id+'\')">حذف</button>':'')+'</div></div>').join('')}
function joinGroup(id){const g=db.groups.find(g=>g.id===id);g.members=g.members.includes(current)?g.members.filter(x=>x!==current):[...g.members,current];save();render()}
function deleteGroup(id){if(me().role!=='super'||!confirm('حذف المجتمع؟'))return;db.groups=db.groups.filter(g=>g.id!==id);save();render()}
function newGroup(){modal('<h2>مجتمع جديد</h2><form onsubmit="event.preventDefault();db.groups.push({id:uid(),name:this.elements.name.value,desc:this.desc.value,icon:\'✦\',members:[current]});save();closeModal();render()"><label>اسم المجتمع<input name="name" required maxlength="70"></label><label>وصفه<input name="desc" required maxlength="180"></label><button class="primary">إنشاء المجتمع</button></form>')}
function search(){const q=query.trim().toLowerCase();return heading('استكشف تواصل','الأفكار والأشخاص الأقرب لاهتماماتك')+'<form class="row card" onsubmit="event.preventDefault();query=this.q.value;render()"><input name="q" value="'+esc(query)+'" placeholder="ابحث هنا…"><button class="primary">بحث</button></form>'+(q?'<h2>الأشخاص</h2><div class="card">'+(db.users.filter(u=>u.active&&u.name.toLowerCase().includes(q)&&u.id!==current).map(person).join('')||'<p class="muted">لا توجد حسابات مطابقة</p>')+'</div><h2>المنشورات</h2>'+postList(db.posts.filter(p=>p.text.toLowerCase().includes(q))):'<div class="card empty">اكتب كلمة وابدأ الاكتشاف ⌕</div>')}

function enterRoom(id){const r=db.rooms.find(r=>r.id===id);if(!r.members.includes(current)){if(r.members.length>=5)return toast('الغرفة مكتملة، الحد الأقصى 5 أشخاص');r.members.push(current)}roomId=id;save();render()}
function leaveRoom(){const r=db.rooms.find(r=>r.id===roomId);r.members=r.members.filter(x=>x!==current);if(!r.members.length)db.rooms=db.rooms.filter(x=>x.id!==r.id);else if(r.host===current)r.host=r.members[0];roomId=null;save();render()}
function setVideo(e){e.preventDefault();const r=db.rooms.find(r=>r.id===roomId);if(r.host!==current)return;try{const u=new URL(e.target.url.value);let id;if(u.hostname==='youtu.be')id=u.pathname.slice(1);else if(['youtube.com','www.youtube.com','m.youtube.com'].includes(u.hostname))id=u.searchParams.get('v')||u.pathname.match(/^\/(?:shorts|embed)\/([\w-]+)/)?.[1];if(!/^[\w-]{11}$/.test(id||''))throw Error();r.video=id;save();render()}catch{toast('أدخل رابط فيديو يوتيوب صالحًا')}}
function roomMessage(e){e.preventDefault();const r=db.rooms.find(r=>r.id===roomId);if(!r.members.includes(current)||!e.target.text.value.trim())return;r.chat.push({by:current,text:e.target.text.value.trim()});save();render()}

let csrf='';
async function request(path,body){const r=await fetch('/api/'+path,{method:body?'POST':'GET',credentials:'same-origin',headers:body?{'Content-Type':'application/json','X-CSRF-Token':csrf}:{},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Object.assign(Error(data.error),{status:r.status});return data}

let stream,ctx;
try{stream=await navigator.mediaDevices.getUserMedia({audio:true});if(page!=='messages'||chatId!==recipient){stream.getTracks().forEach(t=>t.stop());return}ctx=new AudioContext();await ctx.resume();const source=ctx.createMediaStreamSource(stream),processor=ctx.createScriptProcessor(4096,1,1),silent=ctx.createGain();silent.gain.value=0;const parts=[];let total=0;recording={stream,ctx,source,processor,silent,parts,total:0,started:Date.now(),recipient};processor.onaudioprocess=e=>{if(!recording)return;const a=new Float32Array(e.inputBuffer.getChannelData(0));parts.push(a);recording.total+=a.length;if(recording.total/ctx.sampleRate>=120)stopVoice()};
source.connect(processor);processor.connect(silent);silent.connect(ctx.destination);const tray=$('#voiceTray');tray.hidden=false;tray.className='voice-tray';tray.innerHTML='<span class="rec-dot"></span><b id="recTimer">00:00</b><span class="muted grow">جارٍ التسجيل</span><button type="button" onclick="stopVoice()">إيقاف</button><button type="button" onclick="cancelVoice()">إلغاء</button>';recording.timer=setInterval(()=>{const n=Math.floor((Date.now()-recording.started)/1000);const t=$('#recTimer');if(t)t.textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')},500);
}catch(e){stream?.getTracks().forEach(t=>t.stop());ctx?.close();toast(e.name==='NotAllowedError'?'اسمح باستخدام الميكروفون لبدء التسجيل':'تعذر بدء التسجيل، تحقق من الميكروفون')}}
async function stopVoice(){if(!recording)return;const r=recording;recording=null;clearInterval(r.timer);r.processor.onaudioprocess=null;r.source.disconnect();r.processor.disconnect();r.silent.disconnect();r.stream.getTracks().forEach(t=>t.stop());const rate=r.ctx.sampleRate;await r.ctx.close();if(!r.total)return cancelVoice();const input=new Float32Array(r.total);let off=0;for(const p of r.parts){input.set(p,off);off+=p.length}const targetRate=22050,out=new Float32Array(Math.min(120*targetRate,Math.floor(input.length*targetRate/rate)));for(let i=0;i<out.length;i++){const pos=i*rate/targetRate,j=Math.floor(pos),f=pos-j;out[i]=(input[j]||0)*(1-f)+(input[j+1]||0)*f}
voiceDraft={blob:encodeWav(out,targetRate),to:r.recipient};voiceURL=URL.createObjectURL(voiceDraft.blob);const tray=$('#voiceTray');if(!tray)return cancelVoice();tray.innerHTML='<audio controls src="'+voiceURL+'"></audio><button class="primary" onclick="sendVoice()">إرسال</button><button onclick="cancelVoice()">إلغاء</button>'}
function cancelVoice(){if(recording){const r=recording;recording=null;clearInterval(r.timer);r.processor.onaudioprocess=null;r.source.disconnect();r.processor.disconnect();r.stream.getTracks().forEach(t=>t.stop());r.ctx.close()}if(voiceURL)URL.revokeObjectURL(voiceURL);voiceURL=null;voiceDraft=null;const tray=$('#voiceTray');if(tray){tray.hidden=true;tray.innerHTML=''}}
async function sendVoice(){if(!voiceDraft)return;const b=$('#voiceTray button');b.disabled=true;b.textContent='جارٍ الإرسال…';try{const r=await uploadAudio(voiceDraft.blob,'voice'),sent=await request('action',{type:'message',to:voiceDraft.to,audio:r.id});db=sent.db;cancelVoice();paintMessages()}catch(e){toast(e.message);b.disabled=false;b.textContent='إرسال'}}
window.addEventListener('pagehide',cancelVoice);
document.addEventListener('play',e=>{if(e.target.tagName==='AUDIO')document.querySelectorAll('audio').forEach(a=>{if(a!==e.target)a.pause()})},true);
/* ===== LOADER CONTROLLER ===== */
var curP=0,targetP=0,loaderFinished=false,loaderT0=0,loaderTick=0,lastIdx=-1,loaderDoneCb=null;
var loaderMsgs=[[0,"نجهّز مساحتك"],[30,"نربط الاتصال"],[60,"نحمّل محادثاتك"],[90,"جاهز تقريباً"]];
var cv=$('#cv'),cx=cv?.getContext('2d'),W=0,H=0,dpr=1,P=[],B=[],ptr={x:-999,y:-999,on:false};
var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

function resizeCanvas(){
  if(!cv)return;
  dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  var n=W<700?22:45;P=[];
  for(var i=0;i<n;i++)P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:1+Math.random()*1.8,c:Math.random()<.25?"#ff9f8f":"#d3ef8a"});
}
function burstParticles(x,y,n){if(reduce||!B)return;for(var i=0;i<n;i++){var a=Math.random()*6.283,s=1+Math.random()*3;B.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,c:Math.random()<.4?"#ff9f8f":"#d3ef8a"})}}
function drawCanvas(){
  if(!cx)return;
  cx.clearRect(0,0,W,H);
  var i,j,p,q,dx,dy,d;
  for(i=0;i<P.length;i++){
    p=P[i];p.x+=p.vx;p.y+=p.vy;
    if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
    if(ptr.on){dx=ptr.x-p.x;dy=ptr.y-p.y;d=Math.hypot(dx,dy);if(d<170&&d>1){p.x+=dx/d*.9;p.y+=dy/d*.9;cx.globalAlpha=(1-d/170)*.55;cx.strokeStyle="#d3ef8a";cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(ptr.x,ptr.y);cx.stroke()}}
    for(j=i+1;j<P.length;j++){q=P[j];dx=p.x-q.x;dy=p.y-q.y;d=dx*dx+dy*dy;
      if(d<12100){cx.globalAlpha=(1-d/12100)*.3;cx.strokeStyle="#d3ef8a";cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(q.x,q.y);cx.stroke()}}
    cx.globalAlpha=.8;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill();
  }
  for(i=B.length-1;i>=0;i--){p=B[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.95;p.vy*=.95;p.life-=.025;
    if(p.life<=0){B.splice(i,1);continue}
    cx.globalAlpha=p.life;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,2.2,0,6.283);cx.fill()}
  cx.globalAlpha=1;
}

function pingMark(){var m=$('#mark');if(m){m.classList.remove('ping');void m.offsetWidth;m.classList.add('ping')}}
function renderLoader(){
  var p=Math.round(curP);
  var pr=$('#pr'),hd=$('#hd'),pc=$('#pc');
  if(pr)pr.style.strokeDashoffset=880*(1-curP/100);
  if(hd)hd.style.transform="rotate("+(curP*3.6-90)+"deg)";
  if(pc)pc.textContent=p+"%";
  var i=0;loaderMsgs.forEach(function(m,k){if(p>=m[0])i=k});
  if(i!==lastIdx){
    var first=lastIdx<0;lastIdx=i;
    var s=$('#st');if(s){s.style.opacity='0';setTimeout(function(){s.textContent=loaderMsgs[i][1];s.style.opacity='1'},180)}
    if(!first){pingMark();var orb=$('#orbit');if(orb){var r=orb.getBoundingClientRect();burstParticles(r.left+r.width/2,r.top+r.height/2,26)}}
  }
}

function loaderLoop(){
  if(!document.hidden){
    if(!loaderFinished){var el=performance.now()-loaderT0;targetP=Math.max(targetP,Math.min(90,90*(1-Math.exp(-el/1000))))}
    curP+=(targetP-curP)*.1;if(targetP-curP<.15)curP=targetP;
    renderLoader();if(!reduce)drawCanvas();
    if(loaderFinished&&curP>=100){return endLoader()}
  }
  loaderTick=requestAnimationFrame(loaderLoop);
}

function endLoader(){
  var orb=$('#orbit');
  if(orb){var r=orb.getBoundingClientRect();burstParticles(r.left+r.width/2,r.top+r.height/2,60)}
  pingMark();
  setTimeout(function(){
    var ld=$('#loader');
    if(ld){
      ld.classList.add('exit');
      setTimeout(function(){
        ld.style.display='none';
        if(loaderDoneCb) loaderDoneCb();
      },reduce?50:600);
    }
  },reduce?0:350);
}

function startLoader(cb){
  loaderDoneCb=cb;
  loaderFinished=false;curP=0;targetP=0;lastIdx=-1;loaderT0=performance.now();
  resizeCanvas();loaderLoop();
  addEventListener('resize',resizeCanvas);
}

const loaderEl=$('#loader');
if(loaderEl){
  loaderEl.addEventListener('pointerdown',function(e){
    burstParticles(e.clientX,e.clientY,22);
    var r=document.createElement('span');r.className='rp';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';
    document.body.appendChild(r);setTimeout(function(){r.remove()},850);
    var hint=$('#hint');if(hint)hint.style.opacity='0';pingMark();
  });
}

document.body.insertAdjacentHTML('beforeend','<div id="cursorGlow"></div>');
if(!localStorage.getItem('tawasol-theme'))document.body.classList.add('dark');
document.querySelector('header button[aria-label="تبديل المظهر"]').innerHTML=icon('sun');
document.querySelector('header button[aria-label="الإشعارات"]').innerHTML=icon('bell');
document.querySelector('header button[aria-label="الرسائل"]').innerHTML=icon('chat');
let cursorFrame=false;
document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||cursorFrame)return;cursorFrame=true;requestAnimationFrame(()=>{$('#cursorGlow').style.transform='translate('+(e.clientX-200)+'px,'+(e.clientY-200)+'px)';cursorFrame=false})});

async function boot(){
  startLoader(function(){
    if(current){
      render();
    } else {
      showAuthPage('login');
    }
  });

  try {
    await refresh();
  } catch(e) {
  }

  setTimeout(function(){
    loaderFinished=true;
    targetP=100;
  },1400);
}
boot();
async function pollLoop(){
  if(current && !polling && !$('#modal')?.open){
    polling = true;
    try {
      await refresh();
      if(page==='home'||page==='profile')document.querySelectorAll('[data-post]').forEach(el=>{if(!db.posts.some(p=>p.id===el.dataset.post))el.remove()});
      if(page==='messages'){
        paintMessages();
        const typing=$('#typingIndicator');if(typing)typing.innerHTML=user(chatId)?.typing?'يكتب الآن <i></i><i></i><i></i>':'';
        if(db.messages.some(m=>m.from===chatId&&m.to===current&&!m.readAt)){const r=await request('action',{type:'readMessages',from:chatId});db=r.db}
        if((me().blocked||[]).includes(chatId)&&$('#main .message-form')){cancelVoice();render()}
      }
      if(page==='watch'){const log=$('#main .chatlog'),r=db.rooms.find(r=>r.id===roomId);if(log&&r)log.innerHTML=r.chat.map(m=>'<p class="comment"><b>'+esc(user(m.by)?.name||'عضو')+'</b> '+esc(m.text)+'</p>').join('')}
    }catch(e){if(e.status===401)logout(false)}finally{polling=false}
  }
  const delay = (page==='messages'&&chatId)?1000:(page==='messages'?1800:3500);
  setTimeout(pollLoop, delay);
}
pollLoop();
